# Match Renovate's release-age exemption for trusted first-party packages.
minimumReleaseAgeExclude:
  - "@tryghost/*"

# The legacy Inquirer plugins pull in external-editor with an unsafe tmp version.
overrides:
  "external-editor>tmp": 0.2.7

# Not a workspace - this file only records which dependency build scripts are
# allowed to run. Both entries are verified to work without their install
# script, so both stay blocked:
#   dtrace-provider - optional bunyan dep, its install script is
#                     `node-gyp rebuild || node suppress-error.js` and bunyan
#                     works fine without it.
#   sharp           - 0.33+ ships prebuilt binaries as optional dependencies,
#                     so image transforms work without the install script.
allowBuilds:
  dtrace-provider: false
  sharp: false
